name: Terraform — Vulnerable Environment

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - apply
          - destroy

env:
  AWS_REGION: ap-northeast-2
  TF_WORKING_DIR: infra/terraform/environments/vulnerable

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }} (Vulnerable)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.x'

      - name: Terraform Format
        run: terraform fmt -recursive infra/terraform

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_JWT_SECRET }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_JWT_SECRET }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy (on apply failure)
        if: failure() && github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_JWT_SECRET }}
        run: terraform destroy -auto-approve

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_JWT_SECRET }}
        run: terraform destroy -auto-approve

      - name: Export outputs to GitHub Secrets
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          EC2_ID=$(terraform output -raw ec2_instance_id)
          EIP=$(terraform output -raw elastic_ip)

          gh secret set VULN_EC2_INSTANCE_ID --body "$EC2_ID"
          gh secret set TF_VULN_API_URL       --body "http://${EIP}:3000/api"

          echo "✅ VULN_EC2_INSTANCE_ID=$EC2_ID"
          echo "✅ TF_VULN_API_URL=http://${EIP}:3000/api"

      - name: Deploy Frontend to TF Vulnerable S3
        if: github.event.inputs.action == 'apply'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run deploy-frontend.yml \
            --ref feat/terraform-infra \
            --field deploy_tf_envs=true

          echo "✅ deploy-frontend 워크플로우 트리거 완료"

      - name: Output Results
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output -json
