name: Build Guide PDF

on:
  push:
    branches:
      - feat/pdf-guide
      - dev
    paths:
      - 'guide/secure.md'
      - 'guide/vul.md'
      - 'guide/images/secure/**'
      - 'guide/images/vul/**'
      - '.github/workflows/build-guide-pdf.yml'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install Pandoc and XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-lang-cjk fonts-noto-cjk

      - name: Build guide PDFs
        working-directory: guide
        run: |
          mkdir -p pdf
          rm -f pdf/*.pdf

          for guide_name in secure vul; do
            md_file="${guide_name}.md"

            if [ ! -f "$md_file" ]; then
              echo "Missing guide source: $md_file"
              exit 1
            fi

            pandoc "$md_file" \
              --from markdown \
              --resource-path=. \
              --pdf-engine=xelatex \
              -V geometry:margin=1in \
              -V CJKmainfont="Noto Sans CJK KR" \
              -o "pdf/${guide_name}.pdf"
          done

      - name: Upload generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: guide-pdf
          path: |
            guide/pdf/secure.pdf
            guide/pdf/vul.pdf
          if-no-files-found: error

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A guide/pdf

          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi

          git commit -m "docs: auto-generate guide pdf"
          git push origin "${GITHUB_REF_NAME}"
