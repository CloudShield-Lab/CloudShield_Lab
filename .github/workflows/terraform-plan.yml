name: Terraform Plan

on:
  push:
    branches: ['KMS/terraform']
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-plan.yml'
  workflow_dispatch:  # 수동 실행 허용

env:
  AWS_REGION: ap-northeast-2
  TF_VERSION: '1.10.0'

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. 포맷 검사 (자격증명 불필요)
  # ──────────────────────────────────────────────────────────────
  fmt-check:
    name: Terraform Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

  # ──────────────────────────────────────────────────────────────
  # 2. validate + plan (취약/보안 환경 매트릭스)
  # ──────────────────────────────────────────────────────────────
  plan:
    name: Plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    needs: fmt-check
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        env: [vulnerable, secure]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # S3 backend: bucket / key / region을 Secret으로 주입
      - name: Terraform Init
        working-directory: infra/terraform/environments/${{ matrix.env }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=cloudshield/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate
        working-directory: infra/terraform/environments/${{ matrix.env }}
        run: terraform validate

      # 민감 변수는 TF_VAR_* 환경변수로 주입 (tfvars 커밋 없이 plan 실행)
      - name: Terraform Plan
        working-directory: infra/terraform/environments/${{ matrix.env }}
        env:
          TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform plan -no-color
