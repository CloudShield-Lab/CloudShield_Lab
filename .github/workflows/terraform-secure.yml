name: Terraform — Secure Environment

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - apply
          - destroy

env:
  AWS_REGION: ap-northeast-2
  TF_WORKING_DIR: infra/terraform/environments/secure

concurrency:
  group: terraform-secure
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }} (Secure)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.x'

      - name: Terraform Format
        run: terraform fmt -recursive infra/terraform

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_JWT_SECRET }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_JWT_SECRET }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy (on apply failure)
        if: failure() && github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_JWT_SECRET }}
        run: terraform destroy -auto-approve

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
          TF_VAR_jwt_secret: ${{ secrets.TF_JWT_SECRET }}
        run: terraform destroy -auto-approve

      - name: Clear GitHub Secrets after Destroy
        if: github.event.inputs.action == 'destroy'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set SECURE_EC2_INSTANCE_ID --body "DESTROYED"
          gh secret set TF_SECURE_CF_URL       --body "DESTROYED"
          gh secret set TF_SECURE_CF_DIST_ID   --body "DESTROYED"
          echo "✅ 시크릿 초기화 완료"

      - name: Export outputs to GitHub Secrets
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          EC2_ID=$(terraform output -raw ec2_instance_id)
          CF_DOMAIN=$(terraform output -raw cloudfront_domain)
          CF_DIST_ID=$(terraform output -raw cloudfront_distribution_id)

          gh secret set SECURE_EC2_INSTANCE_ID --body "$EC2_ID"
          gh secret set TF_SECURE_CF_URL       --body "https://${CF_DOMAIN}"
          gh secret set TF_SECURE_CF_DIST_ID   --body "$CF_DIST_ID"

          echo "✅ SECURE_EC2_INSTANCE_ID=$EC2_ID"
          echo "✅ TF_SECURE_CF_URL=https://${CF_DOMAIN}"
          echo "✅ TF_SECURE_CF_DIST_ID=$CF_DIST_ID"

      - name: Wait for EC2 user_data & Run Migration
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          EC2_ID=$(terraform output -raw ec2_instance_id)
          echo "EC2 ID: $EC2_ID — user_data 완료 대기 중..."

          for i in $(seq 1 40); do
            echo "[$i/40] 상태 확인 중..."

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$EC2_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["test -f /var/log/user-data-complete && echo DONE || echo WAIT"]' \
              --query "Command.CommandId" \
              --output text 2>/dev/null) || true

            if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
              echo "  → SSM 미준비, 15초 후 재시도..."
              sleep 15
              continue
            fi

            sleep 10

            RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_ID" \
              --query "StandardOutputContent" \
              --output text 2>/dev/null || echo "PENDING")

            if echo "$RESULT" | grep -q "DONE"; then
              echo "✅ user_data 완료 확인!"
              break
            fi

            echo "  → 진행 중... (${RESULT:-PENDING})"
            sleep 15
          done

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker cp sentinelshare-backend:/app/migrations/001_initial_schema.sql /tmp/migration.sql && DB_PASS=$(grep ^DB_PASSWORD= /opt/app/.env | cut -d= -f2) && PGPASSWORD=$DB_PASS psql -h 127.0.0.1 -U sentinelshare -d sentinelshare -f /tmp/migration.sql 2>&1 || echo MIGRATION_ALREADY_DONE"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          sleep 30

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_ID" \
            --query "StandardOutputContent" \
            --output text

      - name: Setup Node.js for frontend deploy
        if: github.event.inputs.action == 'apply'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sentinel-share-frontend/package-lock.json

      - name: Install frontend dependencies
        if: github.event.inputs.action == 'apply'
        working-directory: sentinel-share-frontend
        run: npm ci

      - name: Build frontend for TF Secure
        if: github.event.inputs.action == 'apply'
        working-directory: sentinel-share-frontend
        run: |
          CLOUDFRONT_DOMAIN=$(terraform -chdir="${{ env.TF_WORKING_DIR }}" output -raw cloudfront_domain)
          STATIC_EXPORT=true \
          NEXT_PUBLIC_API_URL="https://${CLOUDFRONT_DOMAIN}/api" \
          NEXT_PUBLIC_ENV_TYPE=secure \
          npm run build

      - name: Deploy frontend to TF Secure S3
        if: github.event.inputs.action == 'apply'
        run: aws s3 sync sentinel-share-frontend/out/ s3://sentinelshare-tf-secure-frontend/ --delete

      - name: Invalidate CloudFront cache (TF Secure)
        if: github.event.inputs.action == 'apply'
        run: |
          DISTRIBUTION_ID=$(terraform -chdir="${{ env.TF_WORKING_DIR }}" output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

      - name: Output Results
        if: github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output -json

  security-verification:
    name: Security Verification (Secure Apply Only)
    needs: terraform
    if: ${{ needs.terraform.result == 'success' && github.event.inputs.action == 'apply' }}
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: ./.github/workflows/security-infra.yml
    with:
      artifact_name: prowler-report-secure
      fail_on_findings: true
      environment_tag: secure
      managed_by_tag: terraform
    secrets: inherit
