name: Dashboard PR CI

on:
  # PR이 생성되거나 업데이트될 때 대시보드 관련 변경만 검사한다.
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master, dev]
    paths:
      - 'attack-dashboard/**'
      - '.github/workflows/ci-dashboard.yml'

env:
  NODE_VERSION: '20'
  IMAGE_NAME: dashboard-pr-ci

jobs:
  dashboard-ci:
    name: Dashboard Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: attack-dashboard/package-lock.json

      - name: Install dashboard dependencies
        # 프런트엔드 빌드와 lint의 기준이 되는 의존성을 고정 설치한다.
        run: npm ci
        working-directory: attack-dashboard

      - name: Run dashboard build
        # 실제 배포 가능한 상태인지 확인하기 위해 production build를 수행한다.
        run: npm run build
        working-directory: attack-dashboard

      - name: Build dashboard Docker image
        # ECS에 올라갈 이미지가 PR 시점에도 정상 빌드되는지 검증한다.
        uses: docker/build-push-action@v5
        with:
          context: ./attack-dashboard
          file: ./attack-dashboard/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Trivy filesystem vulnerability scan
        # 소스 및 lockfile 기준으로 알려진 취약 의존성을 검사한다.
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: ./attack-dashboard
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy filesystem secret scan
        # 코드나 설정 파일에 민감정보가 포함됐는지 함께 확인한다.
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: ./attack-dashboard
          scanners: secret
          exit-code: '1'

      - name: Trivy image vulnerability scan
        # 최종 컨테이너 이미지 관점에서도 취약점을 다시 확인한다.
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
